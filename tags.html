<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="examTools.title">Exam Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/css.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/tags.js"></script>
</head>

<body>
    <div class="min-h-screen bg-gray-50 px-4 py-8">
        <div class="mx-auto max-w-5xl">

            <!-- Header -->
            <div class="mb-6">
                <h1 class="text-2xl font-semibold text-gray-900" data-i18n="tags.title">
                    Tags
                </h1>

                <p class="mt-1 text-sm text-gray-500" data-i18n="tags.description">
                    Manage the tags used throughout the application.
                </p>
            </div>

            <!-- Error -->
            <div id="tags-error" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700"
                role="alert"></div>

            <!-- Table -->
            <div class="overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500"
                                data-i18n="tags.name">
                                Name
                            </th>

                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500"
                                data-i18n="tags.color">
                                Color
                            </th>

                            <th scope="col"
                                class="px-6 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500"
                                data-i18n="tags.options">
                                Options
                            </th>
                        </tr>
                    </thead>

                    <tbody id="tags-table" class="divide-y divide-gray-200">
                        <!-- Tags are inserted here -->

                        <!-- Add tag row -->
                        <tr id="add-tag-row">
                            <td colspan="3" class="px-6 py-4">
                                <button type="button" id="add-tag-button"
                                    class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-700">
                                    <span class="text-lg leading-none">+</span>
                                    <span data-i18n="tags.add">
                                        Add tag
                                    </span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit modal -->
    <div id="tag-modal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
        <div class="absolute inset-0 bg-gray-900/50" id="tag-modal-backdrop"></div>

        <div class="relative flex min-h-full items-center justify-center p-4">
            <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true">
                <div class="mb-5">
                    <h2 id="modal-title" class="text-lg font-semibold text-gray-900" data-i18n="tags.edit">
                        Edit tag
                    </h2>
                </div>

                <form id="tag-form" class="space-y-5">
                    <div>
                        <label for="tag-name" class="block text-sm font-medium text-gray-700" data-i18n="tags.name">
                            Name
                        </label>

                        <input id="tag-name" type="text" maxlength="100" required class="mt-2 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                               text-gray-900 shadow-sm outline-none
                               focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
                    </div>

                    <div>
                        <label for="tag-color" class="block text-sm font-medium text-gray-700" data-i18n="tags.color">
                            Color
                        </label>

                        <div class="mt-2 flex items-center gap-3">
                            <input id="tag-color" type="color"
                                class="h-10 w-14 cursor-pointer rounded border border-gray-300 bg-white p-1">

                            <span id="tag-color-value" class="text-sm text-gray-500"></span>
                        </div>
                    </div>

                    <div id="modal-error"
                        class="hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>

                    <div class="flex justify-end gap-3 pt-2">
                        <button type="button" id="cancel-tag-button" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700
                               hover:bg-gray-50" data-i18n="common.cancel">
                            Cancel
                        </button>

                        <button type="submit" id="save-tag-button" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white
                               hover:bg-indigo-700
                               focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
                               disabled:cursor-not-allowed disabled:opacity-50" data-i18n="common.save">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
