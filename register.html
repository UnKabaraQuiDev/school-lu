<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="register.title">Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/login-register.js"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

<main class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-gray-900 text-center mb-6"
        data-i18n="register.heading">
        Create account
    </h1>

    <form id="register-form" class="space-y-4">

        <div>
            <label for="username"
                   class="block text-sm font-medium text-gray-700 mb-1"
                   data-i18n="register.username">
                Username
            </label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none"
            >
        </div>

        <div>
            <label for="email"
                   class="block text-sm font-medium text-gray-700 mb-1"
                   data-i18n="register.email">
                Email
            </label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none"
            >
        </div>

        <div>
            <label for="password"
                   class="block text-sm font-medium text-gray-700 mb-1"
                   data-i18n="register.password">
                Password
            </label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none"
            >
        </div>

        <div>
            <label for="confirmPassword"
                   class="block text-sm font-medium text-gray-700 mb-1"
                   data-i18n="register.confirmPassword">
                Confirm password
            </label>
            <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                required
                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none"
            >
        </div>

        <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-medium text-white hover:bg-blue-700 focus:ring-2 focus:ring-blue-500"
            data-i18n="register.submit">
            Create account
        </button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-600">
        <span data-i18n="register.hasAccount">Already have an account?</span>
        <a
            href="/login.html"
            class="font-medium text-blue-600 hover:text-blue-700"
            data-i18n="register.login">
            Login
        </a>
    </p>
</main>

</body>
</html>
