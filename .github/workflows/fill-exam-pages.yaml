name: Fill Exam Templates

on:
  push:
    branches:
      - pages
  workflow_run:
    workflows: ["Generate Exam & Exercises Index"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    name: Fill exam-db template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: pages
          fetch-depth: 1
          lfs: false
      
      - name: Create main worktree
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git fetch --depth=1 --no-tags origin main
          git worktree add data main

      - name: Fill exam-db templates
        run: .github/scripts/fill-exams.sh

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit & Push changes
        run: |
          git add exam-db/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: Fill template for exam-db"
            git reset --hard HEAD
            git pull --rebase origin pages
            git push origin HEAD:pages
          fi