name: Crop exercises

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
#  workflow_run:
#    workflows: "Generate Exam & Exercises Index"
#    types: [completed]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check whether exams changed
    runs-on: [self-hosted, linux]

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: main
          lfs: false

      - name: Check exams changes
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Triggered by workflow_dispatch, always running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Finding the last commit that changed exams/..."

          last_exams_commit=$(git log -1 --format='%H' -- exams/)

          if [[ -z "$last_exams_commit" ]]; then
            echo "No commit changing exams/ found."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last exams/ commit:"
          git log -1 --format='%h %s' "$last_exams_commit"

          echo "Checking for a subsequent 'ci: Crop' commit..."

          crop_commit=$(git log \
            -1 \
            --format='%H' \
            --grep='^ci: Crop' \
            "$last_exams_commit..HEAD"
          )

          if [[ -n "$crop_commit" ]]; then
            echo "Found a 'ci: Crop' commit after the last exams/ change:"
            git log -1 --format='%h %s' "$crop_commit"

            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No 'ci: Crop' commit found after the last exams/ change."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    name: Export exam images
    needs: check
    if: needs.check.outputs.should_run == 'true'

    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: main
          fetch-depth: 1

      - name: Export exam images
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python .github/scripts/crop-exams.py --headless --workers 1

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit & Push changes
        run: |
          git add exams/**/*.webp
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: Crop exercise images"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi