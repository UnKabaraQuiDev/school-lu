name: Crop exercises

on:
  workflow_dispatch:
  workflow_run:
    workflows: "Generate Exam & Exercises Index"
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    name: Check whether exams changed
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: main
          lfs: false

      - name: Check exams changes
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Triggered by workflow_dispatch, always running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking whether the last commit changed exams/..."

          # Find the latest commit whose subject does not start with "ci:"
          commit=$(git log -1 --format='%H' --invert-grep --grep='^ci:')

          if [[ -z "$commit" ]]; then
            echo "No non-ci commit found."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking commit:"
          git log -1 --format='%h %s' "$commit"

          if git diff --quiet "${commit}^" "$commit" -- exams/; then
            echo "No changes under exams/."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes under exams/ detected."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    name: Export exam images
    needs: check
    if: needs.check.outputs.should_run == 'true'

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: main
          fetch-depth: 1

      - name: Export exam images
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python .github/scripts/crop-exams.py --headless --workers 4

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit & Push changes
        run: |
          git add exams/exercises.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: Crop exercise images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi