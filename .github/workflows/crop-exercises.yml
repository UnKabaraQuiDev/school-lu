name: Crop exercises

on:
  push:
    branches:
      - main

  workflow_run:
    workflows:
      - "Build"
    types:
      - completed

permissions:
  contents: read

jobs:
  check:
    name: Check whether exams changed
    runs-on: ubuntu-latest

    # workflow_run must always continue.
    # For push, only continue when the last commit changed exams/.
    if: >
      github.event_name == 'workflow_run' ||
      github.event_name == 'push'

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: main
          lfs: false

      - name: Check exams changes
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "Triggered by workflow_run, always running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking whether the last commit changed exams/..."

          if git diff --quiet HEAD^ HEAD -- exams/; then
            echo "No changes under exams/."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes under exams/ detected."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    name: Export exam images
    needs: check
    if: needs.check.outputs.should_run == 'true'

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: main
          depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            PyMuPDF \
            PySide6

      - name: Export exam images
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python .github/scripts/crop-exams.py --headless --workers 4

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit & Push changes
        run: |
          git add exams/exercises.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: Crop exercise images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi