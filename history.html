<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title data-i18n="history.title">Exercise History</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="/js/css.js"></script>
		<script src="/js/i18n.js"></script>
		<script src="/js/api.js"></script>
	</head>
	<body class="min-h-screen bg-gray-100 text-gray-900">
		<main class="mx-auto max-w-5xl px-4 py-8">
			<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
				<div>
					<h1 class="text-3xl font-bold" data-i18n="history.title">
						Exercise History
					</h1>
					<p class="mt-1 text-gray-500" data-i18n="history.description">
						View your past exercises.
					</p>
				</div>
				<div class="flex flex-wrap items-center gap-4">
					
					<!-- Status filter -->
					<fieldset id="status-filter" class="flex items-center gap-3">
						<legend class="mr-1 text-sm font-medium" data-i18n="history.status">
							Status
						</legend>
						<label class="flex cursor-pointer items-center gap-1.5 text-sm">
							<input type="checkbox" value="SUCCESS" class="h-4 w-4 rounded border-gray-300">
							<span class="font-medium text-green-600" data-i18n="actions.success">
								Success
							</span>
						</label>
						<label class="flex cursor-pointer items-center gap-1.5 text-sm">
							<input type="checkbox" value="FAILED" class="h-4 w-4 rounded border-gray-300">
							<span class="font-medium text-red-600" data-i18n="actions.failed">
								Failed
							</span>
						</label>
						<label class="flex cursor-pointer items-center gap-1.5 text-sm">
							<input type="checkbox" value="SKIP" class="h-4 w-4 rounded border-gray-300">
							<span class="font-medium text-gray-500" data-i18n="actions.skip">
								Skip
							</span>
						</label>
					</fieldset>
					
					<!-- Page size -->
					<div class="flex items-center gap-2">
						<label for="page-size" class="text-sm font-medium" data-i18n="history.pageSize">
							Exercises per page
						</label>
						<select id="page-size" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
							<option value="25">25</option>
							<option value="50">50</option>
							<option value="75">75</option>
							<option value="100">100</option>
							<option value="150">150</option>
							<option value="200">200</option>
							<option value="500">500</option>
						</select>
					</div>
				</div>
			</div>
			<div id="selection-bar" class="mb-4 hidden items-center justify-between rounded-xl bg-white p-4 shadow-sm">
				<span class="text-sm font-medium">
					<span id="selected-count">0</span>
					<span data-i18n="history.selected">selected</span>
				</span>
				<button id="delete-selected" type="button" class="rounded-lg bg-red-500 px-4 py-2 font-semibold text-white hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500" data-i18n="history.deleteSelected">
					Delete selected
				</button>
			</div>
			<div id="loading" class="rounded-xl bg-white p-8 text-center shadow-sm">
				<span data-i18n="history.loading">Loading...</span>
			</div>
			<div id="error" class="hidden rounded-xl bg-red-50 p-6 text-center text-red-700">
				<p data-i18n="history.loadError">
					Failed to load your exercise history.
				</p>
				<button id="retry" type="button" class="mt-3 rounded-lg bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700" data-i18n="actions.retry">
					Retry
				</button>
			</div>
			<div id="empty" class="hidden rounded-xl bg-white p-10 text-center shadow-sm">
				<p class="text-gray-500" data-i18n="history.empty">
					You have no past exercises.
				</p>
			</div>
			<div id="exercise-list" class="hidden space-y-4"></div>
			<nav id="pagination" class="mt-8 hidden flex flex-wrap justify-center gap-2" aria-label="Pagination">
			</nav>
		</main>
		<script src="/js/history.js"></script>
	</body>
</html>
