            id="viewer-counter"

        ></div>

    <script>
        const exerciseElements = [
            ...document.querySelectorAll(".exercise")
        ];

        const viewer = document.getElementById("image-viewer");
        const viewerContainer = document.getElementById("viewer-container");
        const viewerImage = document.getElementById("viewer-image");
        const viewerCounter = document.getElementById("viewer-counter");

        let currentExercise = 0;
        let currentImage = 0;

        let scale = 1;
        let translateX = 0;
        let translateY = 0;

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let startTranslateX = 0;
        let startTranslateY = 0;

        let pinchStartDistance = 0;
        let pinchStartScale = 1;


        function getImages(exerciseIndex) {
            return [
                ...exerciseElements[exerciseIndex]
                    .querySelectorAll(".exercise-image img")
            ];
        }


        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;

            updateTransform();
        }


        function updateTransform() {
            viewerImage.style.transform =
                `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }


        function clampScale(value) {
            return Math.min(Math.max(value, 0.5), 8);
        }


        function updateViewer() {
            const images = getImages(currentExercise);
            const image = images[currentImage];

            if (!image) {
                return;
            }

            viewerImage.src = image.src;
            viewerImage.alt = image.alt;

            viewerCounter.textContent =
                `${currentImage + 1} / ${images.length}`;

            resetZoom();
        }


        function openViewer(exerciseIndex, imageIndex) {
            currentExercise = exerciseIndex;
            currentImage = imageIndex;

            viewer.classList.remove("hidden");
            document.body.classList.add("overflow-hidden");

            updateViewer();
        }


        function closeViewer() {
            viewer.classList.add("hidden");
            document.body.classList.remove("overflow-hidden");

            viewerImage.src = "";
        }


        function previousImage() {
            const images = getImages(currentExercise);

            if (currentImage > 0) {
                currentImage--;
            } else {
                currentImage = images.length - 1;
            }

            updateViewer();
        }


        function nextImage() {
            const images = getImages(currentExercise);

            if (currentImage < images.length - 1) {
                currentImage++;
            } else {
                currentImage = 0;
            }

            updateViewer();
        }


        function previousExercise() {
            if (currentExercise <= 0) {
                return;
            }

            currentExercise--;

            const images = getImages(currentExercise);

            currentImage = Math.min(
                currentImage,
                images.length - 1
            );

            updateViewer();
        }


        function nextExercise() {
            if (currentExercise >= exerciseElements.length - 1) {
                return;
            }

            currentExercise++;

            const images = getImages(currentExercise);

            currentImage = Math.min(
                currentImage,
                images.length - 1
            );

            updateViewer();
        }


        exerciseElements.forEach((exercise, exerciseIndex) => {
            const images = exercise.querySelectorAll(".exercise-image");

            images.forEach((image, imageIndex) => {
                image.addEventListener("click", () => {
                    openViewer(exerciseIndex, imageIndex);
                });
            });
        });


        exerciseElements.forEach((exercise) => {
            const container = exercise.querySelector(
                ".exercise-images > div"
            );

            exercise.querySelector(".previous-image")
                .addEventListener("click", () => {
                    container.scrollBy({
                        left: -350,
                        behavior: "smooth"
                    });
                });

            exercise.querySelector(".next-image")
                .addEventListener("click", () => {
                    container.scrollBy({
                        left: 350,
                        behavior: "smooth"
                    });
                });
        });


        document.getElementById("viewer-close")
            .addEventListener("click", closeViewer);

        document.getElementById("viewer-image-prev")
            .addEventListener("click", previousImage);

        document.getElementById("viewer-image-next")
            .addEventListener("click", nextImage);

        document.getElementById("viewer-exercise-prev")
            .addEventListener("click", previousExercise);

        document.getElementById("viewer-exercise-next")
            .addEventListener("click", nextExercise);


        viewerContainer.addEventListener(
            "wheel",
            (event) => {
                event.preventDefault();

                const oldScale = scale;
                const factor = event.deltaY < 0 ? 1.15 : 0.87;

                scale = clampScale(scale * factor);

                const rect = viewerImage.getBoundingClientRect();

                const mouseX =
                    event.clientX -
                    rect.left -
                    rect.width / 2;

                const mouseY =
                    event.clientY -
                    rect.top -
                    rect.height / 2;

                const ratio = scale / oldScale;

                translateX -= mouseX * (ratio - 1);
                translateY -= mouseY * (ratio - 1);

                updateTransform();
            },
            { passive: false }
        );


        viewerContainer.addEventListener("mousedown", (event) => {
            if (scale <= 1) {
                return;
            }

            isDragging = true;

            dragStartX = event.clientX;
            dragStartY = event.clientY;

            startTranslateX = translateX;
            startTranslateY = translateY;
        });


        window.addEventListener("mousemove", (event) => {
            if (!isDragging) {
                return;
            }

            translateX =
                startTranslateX +
                event.clientX -
                dragStartX;

            translateY =
                startTranslateY +
                event.clientY -
                dragStartY;

            updateTransform();
        });


        window.addEventListener("mouseup", () => {
            isDragging = false;
        });


        function touchDistance(a, b) {
            const dx = a.clientX - b.clientX;
            const dy = a.clientY - b.clientY;

            return Math.sqrt(dx * dx + dy * dy);
        }


        viewerContainer.addEventListener(
            "touchstart",
            (event) => {
                if (event.touches.length === 2) {
                    pinchStartDistance = touchDistance(
                        event.touches[0],
                        event.touches[1]
                    );

                    pinchStartScale = scale;
                    return;
                }

                if (event.touches.length === 1 && scale > 1) {
                    isDragging = true;

                    dragStartX = event.touches[0].clientX;
                    dragStartY = event.touches[0].clientY;

                    startTranslateX = translateX;
                    startTranslateY = translateY;
                }
            },
            { passive: false }
        );


        viewerContainer.addEventListener(
            "touchmove",
            (event) => {
                event.preventDefault();

                if (event.touches.length === 2) {
                    const distance = touchDistance(
                        event.touches[0],
                        event.touches[1]
                    );

                    scale = clampScale(
                        pinchStartScale *
                        (distance / pinchStartDistance)
                    );

                    updateTransform();
                    return;
                }

                if (event.touches.length === 1 && isDragging) {
                    translateX =
                        startTranslateX +
                        event.touches[0].clientX -
                        dragStartX;

                    translateY =
                        startTranslateY +
                        event.touches[0].clientY -
                        dragStartY;

                    updateTransform();
                }
            },
            { passive: false }
        );


        viewerContainer.addEventListener("touchend", () => {
            isDragging = false;
        });


        document.addEventListener("keydown", (event) => {
            if (viewer.classList.contains("hidden")) {
                return;
            }

            switch (event.key) {
                case "Escape":
                    closeViewer();
                    break;

                case "ArrowLeft":
                    previousImage();
                    break;

                case "ArrowRight":
                    nextImage();
                    break;

                case "ArrowUp":
                    previousExercise();
                    break;

                case "ArrowDown":
                    nextExercise();
                    break;

                case "+":
                case "=":
                    scale = clampScale(scale * 1.2);
                    updateTransform();
                    break;

                case "-":
                    scale = clampScale(scale * 0.8);
                    updateTransform();
                    break;

                case "0":
                    resetZoom();
                    break;
            }
        });


        viewer.addEventListener("click", (event) => {
            if (event.target === viewer) {
                closeViewer();
            }
        });
    </script>
</body>
</html>
